function glowTexture(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,2,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.08,'rgba(255,225,130,.95)');g.addColorStop(.32,'rgba(255,170,50,.3)');g.addColorStop(1,'rgba(255,110,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function addSun(){const g=new THREE.SphereGeometry(CONFIG.sunRadius,quality==='eco'?32:64,quality==='eco'?20:40);const m=new THREE.MeshBasicMaterial({color:0xffc55d});sun=new THREE.Mesh(g,m);sun.name='Sun';sun.userData.radius=CONFIG.sunRadius;scene.add(sun);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.95}));s.scale.set(6.8,6.8,1);sun.add(s);const corona=new THREE.Mesh(new THREE.SphereGeometry(CONFIG.sunRadius*1.32,32,20),new THREE.MeshBasicMaterial({color:0xffa33b,transparent:true,opacity:.08,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending}));sun.add(corona)}
function normalize(raw){const get=(...keys)=>{for(const k of keys)if(raw?.[k]!=null)return raw[k]};let d=Number(get('distanceFromSunKm','distanceKm','semiMajorAxisKm','orbitalDistanceKm'));let au=Number(get('distanceAU','semiMajorAxisAU','orbitalDistanceAU'));if(!Number.isFinite(d)&&Number.isFinite(au))d=au*AU;return{name:String(get('name','title')??'Unnamed'),type:String(get('type','category')??'planet').toLowerCase(),radiusKm:Number(get('radiusKm','radius','meanRadiusKm')),distanceFromSunKm:d,orbitalPeriodDays:Number(get('orbitalPeriodDays','orbitPeriodDays','periodDays','orbitalPeriod')),massKg:Number(get('massKg','mass')),rotationPeriodHours:Number(get('rotationPeriodHours','rotationHours','rotationPeriod')),axialTilt:Number(get('axialTiltDegrees','axialTilt','tiltDegrees')),description:String(get('description','summary')??'Astronomical object in the current catalog.'),texture:get('texture','textureUrl','image')};}
async function loadCatalog(){setLoading('Loading data/planets.json…');let data=fallback,source='BUILT-IN';try{const r=await fetch('data/planets.json?cache='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();const arr=Array.isArray(j)?j:(Array.isArray(j.planets)?j.planets:(Array.isArray(j.objects)?j.objects:Object.entries(j).map(([name,v])=>typeof v==='object'?{name,...v}:{name,type:'planet'})));const n=arr.map(normalize).filter(x=>x.name);if(n.length){data=n;source='PLANETS.JSON'}}catch(e){console.warn(e);toast('Using built-in planet data');}setLoading('Building textured planetary system…');buildPlanets(data);$('#statusText').textContent=source+' · '+data.length+' PLANETS';$('#loading').classList.add('hide')}
async function loadMoons(){try{const r=await fetch('data/moons.json?cache='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json();const arr=Array.isArray(j)?j:(j.moons||[]);moons=arr.length?arr:moonFallback}catch(e){moons=moonFallback}setTimeout(()=>buildMoons(),80)}
function visualRadius(o){return THREE.MathUtils.clamp((o.radiusKm||3000)*CONFIG.planetRadiusScale,CONFIG.minRadius,CONFIG.maxRadius)}
function orbitalRadius(o){const au=(o.distanceFromSunKm||AU)/AU;return Math.max(.68,Math.cbrt(Math.max(au,.01))*CONFIG.AU_SCALE)}
function loadTex(url){if(textureCache.has(url))return textureCache.get(url);const t=textureLoader.load(url,()=>{},undefined,()=>{});t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),4);textureCache.set(url,t);return t}
function materialFor(o){const color=palette[o.name]??0x8794a8;const src=o.texture?[o.texture,...(textureSources[o.name]||[])]:textureSources[o.name]||[];let map=null;for(const u of src){try{map=loadTex(u);break}catch{}}return new THREE.MeshStandardMaterial({color,map,roughness:o.type==='moon'?1:.82,metalness:0,emissive:new THREE.Color(color).multiplyScalar(.018)})}
function createOrbit(r,opacity=.2){const pts=[];const seg=quality==='eco'?72:144;for(let i=0;i<seg;i++){const a=i/seg*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r))}const g=new THREE.BufferGeometry().setFromPoints(pts);return new THREE.LineLoop(g,new THREE.LineBasicMaterial({color:0x526078,transparent:true,opacity}))}
function buildPlanets(data){objects.forEach(o=>o.group?.traverse(n=>{n.geometry?.dispose();if(n.material?.dispose)n.material.dispose()}));objects=[];for(const o of data){if(!Number.isFinite(o.distanceFromSunKm)||o.name==='Sun')continue;const pivot=new THREE.Group();pivot.name=o.name+' Orbit';objectRoot.add(pivot);const r=orbitalRadius(o),vr=visualRadius(o);const geo=new THREE.SphereGeometry(vr,quality==='eco'?24:40,quality==='eco'?16:26);const mesh=new THREE.Mesh(geo,materialFor(o));mesh.position.x=r;mesh.castShadow=quality!=='eco';mesh.receiveShadow=true;mesh.userData={object:o,radius:vr};if(Number.isFinite(o.axialTilt))mesh.rotation.z=THREE.MathUtils.degToRad(o.axialTilt);pivot.add(mesh);const orbit=createOrbit(r);orbit.visible=showOrbits;objectRoot.add(orbit);const item={data:o,pivot,mesh,orbit,r,baseSpeed:Number.isFinite(o.orbitalPeriodDays)?365.25/o.orbitalPeriodDays:.1,group:pivot};pivot.rotation.y=Math.random()*Math.PI*2;if(o.name==='Saturn')addSaturnRings(mesh,vr);if(o.name==='Earth')addEarthEnhancements(mesh,vr);if(o.name==='Venus')addCloudShell(mesh,vr,0.018,0.13);if(o.name==='Neptune'||o.name==='Jupiter')addCloudShell(mesh,vr,0.012,0.06);objects.push(item)}renderList();select(objects.find(x=>x.data.name==='Earth')||objects[0],false);resetView()}
function addSaturnRings(mesh,r){const ring=new THREE.Mesh(new THREE.RingGeometry(r*1.5,r*2.35,72),new THREE.MeshStandardMaterial({color:0xc5ad7c,roughness:1,metalness:0,transparent:true,opacity:.64,side:THREE.DoubleSide}));ring.rotation.x=Math.PI/2.1;mesh.add(ring)}
function addCloudShell(mesh,r,scale,opacity){const cloud=new THREE.Mesh(new THREE.SphereGeometry(r*(1+scale),quality==='eco'?24:40,quality==='eco'?16:26),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity,depthWrite:false}));mesh.add(cloud)}
function addEarthEnhancements(mesh,r){const clouds=loadTex('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r180/examples/textures/planets/earth_clouds_1024.png');const c=new THREE.Mesh(new THREE.SphereGeometry(r*1.012,quality==='eco'?24:40,quality==='eco'?16:26),new THREE.MeshLambertMaterial({map:clouds,transparent:true,opacity:.74,depthWrite:false}));mesh.add(c);const atmo=new THREE.Mesh(new THREE.SphereGeometry(r*1.055,quality==='eco'?24:40,quality==='eco'?16:26),new THREE.MeshBasicMaterial({color:0x55b8ff,transparent:true,opacity:.09,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending}));mesh.add(atmo)}
function buildMoons(){if(!showMoons)return;const parentMap=new Map(objects.map(o=>[o.data.name,o]));for(const o of moons){const parent=parentMap.get(o.parent);if(!parent)continue;const pivot=new THREE.Group();pivot.name=o.name+' Orbit';parent.mesh.add(pivot);const pr=parent.mesh.userData.radius||.2;const mr=THREE.MathUtils.clamp((o.radiusKm||1000)*.0000018,.025,.25);const distance=Math.max(pr*2.5,Math.cbrt(Math.max(o.distanceFromParentKm||100000,1)/100000)*.95);const mesh=new THREE.Mesh(new THREE.SphereGeometry(mr,quality==='eco'?16:24,quality==='eco'?12:16),materialFor(o));mesh.position.x=distance;mesh.userData={object:o,radius:mr};mesh.castShadow=quality!=='eco';pivot.add(mesh);const orbit=createOrbit(distance,.13);orbit.scale.set(1,1,1);orbit.visible=showOrbits;parent.mesh.add(orbit);pivot.rotation.y=Math.random()*Math.PI*2;moons.find(m=>m.name===o.name).__runtime={pivot,mesh,orbit,parent};}}
function renderList(filter='all',term=''){const q=term.toLowerCase();$('#objectList').innerHTML='';const list=objects.filter(x=>filter==='all'||x.data.type.includes(filter)).filter(x=>!q||x.data.name.toLowerCase().includes(q));for(const item of list){const d=item.data;const b=document.createElement('button');b.className='object'+(selected===item?' selected':'');b.innerHTML=`<span class="object-dot" style="background:#${(palette[d.name]??0x8ca0b8).toString(16).padStart(6,'0')}"></span><span><span class="object-name">${d.name}</span><span class="object-meta">${d.type} · ${Number.isFinite(d.distanceFromSunKm)?fmt(d.distanceFromSunKm)+' km':''}</span></span><span class="object-arrow">›</span>`;b.onclick=()=>select(item,true);$('#objectList').appendChild(b)}}
function select(item,focus=true){if(!item)return;selected=item;renderList(activeFilter,$('#search').value);updateInfo();if(focus)focusObject(item)}
function updateInfo(){const d=selected.data;$('#info').innerHTML=`<div class="type">${d.type}</div><h2>${d.name}</h2><div class="desc">${d.description}</div><div class="stats"><div class="stat"><span>Distance</span><b>${Number.isFinite(d.distanceFromSunKm)?fmt(d.distanceFromSunKm)+' km':'—'}</b></div><div class="stat"><span>Radius</span><b>${Number.isFinite(d.radiusKm)?fmt(d.radiusKm)+' km':'—'}</b></div><div class="stat"><span>Orbital period</span><b>${Number.isFinite(d.orbitalPeriodDays)?Number(d.orbitalPeriodDays).toFixed(2)+' days':'—'}</b></div><div class="stat"><span>Mass</span><b>${fmtMass(d.massKg)}</b></div></div><div class="chiprow"><span class="chip">Textured</span><span class="chip">3D lighting</span>${d.name==='Earth'?'<span class="chip">Atmosphere</span><span class="chip">Cloud layer</span>':''}</div><button class="focus-btn" id="focusBtn">Focus ${d.name} ↗</button>`;$('#focusBtn').onclick=()=>focusObject(selected)}
function focusObject(item){const p=new THREE.Vector3();item.mesh.getWorldPosition(p);const r=item.mesh.userData.radius||.1;const distance=Math.max(.48,r*6.8);const dir=new THREE.Vector3(.9,.38,.9).normalize();camera.position.copy(p).add(dir.multiplyScalar(distance));controls.target.copy(p);controls.update();toast('Focused on '+item.data.name)}
function resetView(){camera.position.set(0,25,52);controls.target.set(0,0,0);controls.update();toast('System view restored')}
function bind(){
 $('#resetBtn').onclick=resetView;$('#labelsBtn').onclick=()=>{showLabels=!showLabels;toast('Labels '+(showLabels?'enabled':'disabled'))};$('#qualityBtn').onclick=()=>$('#qualityPop').classList.toggle('show');
 document.querySelectorAll('[data-quality]').forEach(b=>b.onclick=()=>{quality=b.dataset.quality;$('#qualityPop').classList.remove('show');toast('Quality set to '+quality.toUpperCase()+' · reload for full effect');setTimeout(()=>location.reload(),650)});
 $('#pauseBtn').onclick=()=>{paused=!paused;$('#pauseBtn').textContent=paused?'Play':'Pause'};$('#orbitsBtn').onclick=()=>{showOrbits=!showOrbits;objects.forEach(o=>o.orbit.visible=showOrbits);moons.forEach(m=>m.__runtime&&(m.__runtime.orbit.visible=showOrbits));$('#orbitsBtn').classList.toggle('active',showOrbits)};
 $('#moonsBtn').onclick=()=>{showMoons=!showMoons;moons.forEach(m=>{if(m.__runtime)m.__runtime.parent.mesh.remove(m.__runtime.pivot);});if(showMoons)buildMoons();$('#moonsBtn').classList.toggle('active',showMoons)};
 document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))});
 document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderList(activeFilter,$('#search').value)});
 $('#search').addEventListener('input',e=>renderList(activeFilter,e.target.value));window.addEventListener('keydown',e=>{if(e.key==='/'){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){$('#search').value='';renderList(activeFilter,'');$('#search').blur()}});window.addEventListener('resize',onResize);renderer.domElement.addEventListener('pointerdown',onPointer);
}
function onPointer(e){if(e.button!==0)return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(pointer,camera);const targets=objects.map(o=>o.mesh);moons.forEach(m=>m.__runtime&&targets.push(m.__runtime.mesh));const hits=raycaster.intersectObjects(targets,false);if(!hits.length)return;const hit=hits[0].object;const item=objects.find(o=>o.mesh===hit);if(item)select(item,true);else{const m=moons.find(x=>x.__runtime?.mesh===hit);if(m){const runtime=m.__runtime;const p=new THREE.Vector3();runtime.mesh.getWorldPosition(p);controls.target.copy(p);camera.position.copy(p).add(new THREE.Vector3(.25,.14,.25));controls.update();toast('Focused on '+m.name)}}}
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,CONFIG.maxDpr));renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(!paused){const days=dt*CONFIG.daysPerSecond*speed;for(const o of objects){o.pivot.rotation.y+=days*o.baseSpeed/365.25*Math.PI*2;const rot=o.data.rotationPeriodHours;if(Number.isFinite(rot)&&rot!==0)o.mesh.rotation.y+=dt*(24/Math.abs(rot))*.02;else o.mesh.rotation.y+=dt*.001}if(showMoons){for(const m of moons){const r=m.__runtime;if(!r)continue;const p=m.orbitalPeriodDays||10;r.pivot.rotation.y+=days/p*Math.PI*2}}}controls.update();composer.render()}
init();
</script>
