<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#01040a">
<title>Universe Explorer</title>
<style>
:root{--background:#01040a;--panel:rgba(4,10,20,.78);--border:rgba(255,255,255,.12);--text:#eef7ff;--muted:#8ea0b5;--accent:#6fc9ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:Inter,Arial,sans-serif}body{position:relative}#space{position:absolute;inset:0}.ui{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:18px;left:18px;right:18px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 16px;pointer-events:auto;border:1px solid var(--border);border-radius:17px;background:rgba(3,8,17,.68);backdrop-filter:blur(20px);box-shadow:0 15px 50px rgba(0,0,0,.4)}.brand{display:flex;align-items:center;gap:11px}.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,white 0%,#8bddff 20%,#176a9e 50%,#010711 72%);box-shadow:0 0 25px rgba(75,190,255,.45)}.brand strong{display:block;font-size:14px;letter-spacing:.12em;text-transform:uppercase}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.search{width:min(370px,42vw)}.search input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:11px;outline:none;color:white;background:rgba(255,255,255,.045)}.search input:focus{border-color:rgba(111,201,255,.6);box-shadow:0 0 0 3px rgba(111,201,255,.08)}.left-panel{position:absolute;left:18px;top:88px;bottom:18px;width:235px;padding:14px;pointer-events:auto;border:1px solid var(--border);border-radius:18px;background:var(--panel);backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:auto}.section-title{margin:8px 5px 10px;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.object-button{width:100%;display:flex;align-items:center;gap:10px;margin-bottom:5px;padding:10px;border:1px solid transparent;border-radius:10px;color:#dceaf7;background:transparent;text-align:left;cursor:pointer;transition:.2s}.object-button:hover,.object-button.active{background:rgba(255,255,255,.06);border-color:var(--border)}.object-dot{width:8px;height:8px;flex-shrink:0;border-radius:50%;background:white;box-shadow:0 0 12px currentColor}.info-panel{position:absolute;top:88px;right:18px;width:300px;padding:18px;pointer-events:auto;border:1px solid var(--border);border-radius:18px;background:var(--panel);backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.4)}.object-type{margin-bottom:6px;color:var(--accent);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.object-name{margin-bottom:7px;font-size:25px;font-weight:600}.description{margin-bottom:18px;color:var(--muted);font-size:12px;line-height:1.6}.data{display:grid;gap:9px}.data-row{display:flex;justify-content:space-between;gap:15px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px}.data-row span:first-child{color:var(--muted)}.data-row span:last-child{text-align:right}.controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:9px;pointer-events:auto;border:1px solid var(--border);border-radius:15px;background:rgba(3,8,17,.75);backdrop-filter:blur(20px)}.control-btn{min-width:42px;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:9px;color:#dceeff;background:rgba(255,255,255,.045);cursor:pointer}.control-btn:hover{background:rgba(255,255,255,.1)}.speed{min-width:45px;color:var(--muted);font-size:11px;text-align:center}#label{position:absolute;display:none;padding:6px 9px;border:1px solid rgba(255,255,255,.12);border-radius:8px;color:white;background:rgba(2,7,14,.8);backdrop-filter:blur(10px);font-size:11px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-130%)}#loading{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#01040a;transition:opacity .8s ease}.loader{width:42px;height:42px;margin-bottom:15px;border:2px solid rgba(255,255,255,.08);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#loadingText{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}.error{color:#ff9b9b!important}@media(max-width:800px){.left-panel{width:190px}.info-panel{width:250px}}@media(max-width:600px){.topbar{top:8px;left:8px;right:8px}.search{display:none}.left-panel{left:8px;bottom:70px;top:auto;width:150px;max-height:37vh}.info-panel{right:8px;top:auto;bottom:70px;width:195px;max-height:37vh;overflow:auto}.object-name{font-size:19px}.description{font-size:10px}.controls{bottom:8px;max-width:94vw;overflow:auto}}
</style>
</head>
<body>
<div id="loading"><div class="loader"></div><div id="loadingText">Loading Universe...</div></div>
<div id="space"></div>
<div class="ui">
<header class="topbar"><div class="brand"><div class="logo">✦</div><div><strong>Universe Explorer</strong><span>Interactive 3D Space Sandbox</span></div></div><div class="search"><input id="search" type="search" placeholder="Search a planet..."></div></header>
<aside class="left-panel"><div class="section-title">Solar System</div><div id="planetList"></div><div class="section-title">Space Objects</div><button class="object-button" data-special="Black Hole"><span class="object-dot" style="color:#c987ff"></span>Black Hole</button><button class="object-button" data-special="Pulsar"><span class="object-dot" style="color:#72d7ff"></span>Pulsar</button><button class="object-button" data-special="Quasar"><span class="object-dot" style="color:#ffb86b"></span>Quasar</button></aside>
<aside class="info-panel"><div class="object-type" id="type">SYSTEM</div><div class="object-name" id="name">Solar System</div><div class="description" id="description">Loading astronomical data...</div><div class="data"><div class="data-row"><span>Radius</span><span id="radius">—</span></div><div class="data-row"><span>Mass</span><span id="mass">—</span></div><div class="data-row"><span>Distance</span><span id="distance">—</span></div><div class="data-row"><span>Orbit</span><span id="orbit">—</span></div><div class="data-row"><span>Rotation</span><span id="rotation">—</span></div><div class="data-row"><span>Category</span><span id="category">—</span></div></div></aside>
<div class="controls"><button class="control-btn" id="reset">⟳</button><button class="control-btn" id="pause">❚❚</button><button class="control-btn" id="slower">−</button><div class="speed" id="speed">1×</div><button class="control-btn" id="faster">+</button><button class="control-btn" id="labels">Labels</button></div>
</div><div id="label"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
let planetData={},objects={},paused=false,simulationSpeed=1,labelsEnabled=false,selectedObject=null;
const container=document.getElementById("space"),scene=new THREE.Scene();scene.background=new THREE.Color(0x01040a);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,5000);camera.position.set(0,7,18);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;container.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.045;controls.minDistance=.5;controls.maxDistance=3000;
scene.add(new THREE.AmbientLight(0x405060,.2));const sunLight=new THREE.PointLight(0xffffff,5,0,1.5);scene.add(sunLight);
function createStarfield(){const count=16000,positions=new Float32Array(count*3);for(let i=0;i<count;i++){const j=i*3;positions[j]=(Math.random()-.5)*2500;positions[j+1]=(Math.random()-.5)*2500;positions[j+2]=(Math.random()-.5)*2500}const geometry=new THREE.BufferGeometry();geometry.setAttribute("position",new THREE.BufferAttribute(positions,3));return new THREE.Points(geometry,new THREE.PointsMaterial({color:0xffffff,size:.65,transparent:true,opacity:.85,sizeAttenuation:true}))}const stars=createStarfield();scene.add(stars);
const DISTANCE_SCALE=1e-8,RADIUS_SCALE=2.5e-5;
function createOrbit(radius){const points=[];for(let i=0;i<=160;i++){const a=i/160*Math.PI*2;points.push(new THREE.Vector3(Math.cos(a)*radius,0,Math.sin(a)*radius))}const geometry=new THREE.BufferGeometry().setFromPoints(points),material=new THREE.LineBasicMaterial({color:0x27445a,transparent:true,opacity:.45}),orbit=new THREE.LineLoop(geometry,material);scene.add(orbit);return orbit}
function getPlanetColor(name){const colors={Sun:0xffcc66,Mercury:0x9d9184,Venus:0xd9a85f,Earth:0x3e86c7,Mars:0xb64d35,Jupiter:0xc28b62,Saturn:0xd2b47d,Uranus:0x74cbd0,Neptune:0x4169c1};return colors[name]??0xaaaaaa}
function createPlanet(data){const distance=Number(data.distanceFromSunKm||0)*DISTANCE_SCALE;let radius=Number(data.radiusKm||1)*RADIUS_SCALE;radius=Math.max(radius,.14);const orbitGroup=new THREE.Group();orbitGroup.userData={...data,orbitRadius:distance,objectType:data.type,angle:Math.random()*Math.PI*2};const planet=new THREE.Mesh(new THREE.SphereGeometry(radius,48,48),new THREE.MeshStandardMaterial({color:getPlanetColor(data.name),roughness:.8,metalness:.02}));planet.position.set(Math.cos(orbitGroup.userData.angle)*distance,0,Math.sin(orbitGroup.userData.angle)*distance);orbitGroup.add(planet);orbitGroup.userData.planet=planet;objects[data.name]=orbitGroup;scene.add(orbitGroup);if(distance>0)orbitGroup.userData.orbit=createOrbit(distance);if(String(data.name).toLowerCase()==="earth")createEarthAtmosphere(planet,radius);if(String(data.name).toLowerCase()==="saturn")createSaturnRings(planet,radius);return orbitGroup}
function createEarthAtmosphere(planet,radius){planet.add(new THREE.Mesh(new THREE.SphereGeometry(radius*1.07,48,48),new THREE.MeshBasicMaterial({color:0x4ebcff,transparent:true,opacity:.14,side:THREE.BackSide,blending:THREE.AdditiveBlending})))}
function createSaturnRings(planet,radius){const rings=new THREE.Mesh(new THREE.RingGeometry(radius*1.4,radius*2.4,96),new THREE.MeshBasicMaterial({color:0xd8c08c,transparent:true,opacity:.65,side:THREE.DoubleSide}));rings.rotation.x=Math.PI/2;rings.rotation.z=.35;planet.add(rings)}
function createSun(data){const radius=Math.max(Number(data.radiusKm||696340)*RADIUS_SCALE,2),sun=new THREE.Mesh(new THREE.SphereGeometry(radius,64,64),new THREE.MeshBasicMaterial({color:0xffcc66}));sun.userData={...data,name:data.name};scene.add(sun);objects[data.name]=sun;const glow=new THREE.Mesh(new THREE.SphereGeometry(radius*1.3,64,64),new THREE.MeshBasicMaterial({color:0xff9f2e,transparent:true,opacity:.12,blending:THREE.AdditiveBlending}));sun.add(glow);return sun}
function normalizeData(raw){if(Array.isArray(raw)){const result={};raw.forEach((item,index)=>{if(item&&typeof item==="object"){const name=item.name||`Object ${index+1}`;result[String(name).toLowerCase()]=item}});return result}if(raw&&typeof raw==="object")return raw;throw new Error("planets.json must contain an object or array.")}
async function loadPlanetData(){const loadingText=document.getElementById("loadingText");try{loadingText.textContent="Loading astronomical data...";const response=await fetch("data/planets.json",{cache:"no-store"});if(!response.ok)throw new Error(`Could not load data/planets.json (${response.status})`);planetData=normalizeData(await response.json());loadingText.textContent="Building Solar System...";buildSolarSystem();populatePlanetList();if(findDataKey("Earth"))selectObject("Earth");loadingText.textContent="Universe ready";setTimeout(hideLoadingScreen,500)}catch(error){console.error(error);loadingText.textContent="Could not load planets.json";loadingText.classList.add("error");document.getElementById("description").textContent="Make sure data/planets.json exists and contains valid JSON."}}
function buildSolarSystem(){objects={};Object.values(planetData).forEach(data=>{if(!data||!data.name)return;const type=String(data.type||"").toLowerCase();if(type==="star"||String(data.name).toLowerCase()==="sun")createSun(data);else if(type==="planet")createPlanet(data)})}
function populatePlanetList(){const list=document.getElementById("planetList");list.innerHTML="";Object.values(planetData).forEach(data=>{if(!data||!data.name)return;const type=String(data.type||"").toLowerCase();if(type!=="planet"&&type!=="star")return;const button=document.createElement("button");button.className="object-button";button.dataset.object=data.name;const dot=document.createElement("span");dot.className="object-dot";dot.style.color="#"+getPlanetColor(data.name).toString(16).padStart(6,"0");const text=document.createElement("span");text.textContent=data.name;button.append(dot,text);button.addEventListener("click",()=>selectObject(data.name));list.appendChild(button)})}
function createDescription(data){const descriptions={Sun:"The star at the center of our Solar System.",Mercury:"The smallest planet and the closest planet to the Sun.",Venus:"A rocky planet with an extremely dense atmosphere.",Earth:"Our home planet and the third planet from the Sun.",Mars:"A cold terrestrial planet with a thin atmosphere.",Jupiter:"The largest planet in the Solar System.",Saturn:"A gas giant famous for its extensive ring system.",Uranus:"An ice giant rotating with an extreme axial tilt.",Neptune:"A distant ice giant with powerful atmospheric winds."};return descriptions[data.name]||"Astronomical object loaded from the universe database."}
function formatNumber(number){return new Intl.NumberFormat("en-US",{maximumFractionDigits:2}).format(Number(number))}function formatScientific(number){return Number(number).toExponential(3)}
function updateInformation(data){document.getElementById("type").textContent=data.type?String(data.type).toUpperCase():"OBJECT";document.getElementById("name").textContent=data.name||"Unknown";document.getElementById("description").textContent=createDescription(data);document.getElementById("radius").textContent=data.radiusKm?formatNumber(data.radiusKm)+" km":"—";document.getElementById("mass").textContent=data.massKg?formatScientific(data.massKg)+" kg":"—";document.getElementById("distance").textContent=data.distanceFromSunKm?formatNumber(data.distanceFromSunKm)+" km":"Center";document.getElementById("orbit").textContent=data.orbitalPeriodDays?formatNumber(data.orbitalPeriodDays)+" days":"—";document.getElementById("rotation").textContent=data.rotationPeriodHours?formatNumber(data.rotationPeriodHours)+" hours":"—";document.getElementById("category").textContent=data.type||"Unknown"}
function findDataKey(name){return Object.keys(planetData).find(key=>String(planetData[key]?.name||"").toLowerCase()===String(name).toLowerCase())}
function selectObject(name){const key=findDataKey(name);if(!key)return;const data=planetData[key];selectedObject=data.name;updateInformation(data);document.querySelectorAll(".object-button[data-object]").forEach(btn=>btn.classList.toggle("active",btn.dataset.object===data.name));focusObject(data.name)}
function focusObject(name){const object=objects[name];if(!object)return;const target=new THREE.Vector3();object.getWorldPosition(target);controls.target.copy(target);const isSun=String(name).toLowerCase()==="sun";const distance=isSun?14:5;camera.position.set(target.x+distance,target.y+distance*.5,target.z+distance)}
document.getElementById("search").addEventListener("keydown",event=>{if(event.key!=="Enter")return;const query=event.target.value.trim().toLowerCase();if(!query)return;const key=Object.keys(planetData).find(k=>String(planetData[k]?.name||"").toLowerCase().includes(query));if(key)selectObject(planetData[key].name)});
document.querySelectorAll("[data-special]").forEach(button=>button.addEventListener("click",()=>{document.getElementById("description").textContent=`${button.dataset.special} catalog integration is reserved for the next data phase.`;document.getElementById("type").textContent="SPACE OBJECT";document.getElementById("name").textContent=button.dataset.special;["radius","mass","distance","orbit","rotation"].forEach(id=>document.getElementById(id).textContent="—");document.getElementById("category").textContent=button.dataset.special}));
document.getElementById("pause").addEventListener("click",()=>{paused=!paused;document.getElementById("pause").textContent=paused?"▶":"❚❚"});document.getElementById("faster").addEventListener("click",()=>{simulationSpeed=Math.min(simulationSpeed*2,1024);document.getElementById("speed").textContent=simulationSpeed+"×"});document.getElementById("slower").addEventListener("click",()=>{simulationSpeed=Math.max(simulationSpeed/2,.125);document.getElementById("speed").textContent=simulationSpeed+"×"});document.getElementById("reset").addEventListener("click",()=>{camera.position.set(0,7,18);controls.target.set(0,0,0);simulationSpeed=1;paused=false;document.getElementById("pause").textContent="❚❚";document.getElementById("speed").textContent="1×"});document.getElementById("labels").addEventListener("click",()=>{labelsEnabled=!labelsEnabled;document.getElementById("label").style.display=labelsEnabled?"block":"none"});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const delta=clock.getDelta();if(!paused){if(objects.Sun)objects.Sun.rotation.y+=delta*.05*simulationSpeed;Object.values(objects).forEach(object=>{if(!object?.userData?.planet)return;const planet=object.userData.planet;planet.rotation.y+=delta*.3*simulationSpeed;const orbitRadius=object.userData.orbitRadius;if(!orbitRadius)return;const period=Number(object.userData.orbitalPeriodDays)||365.25;const baseAngularSpeed=(Math.PI*2)/period;object.userData.angle+=baseAngularSpeed*simulationSpeed*delta*12;planet.position.x=Math.cos(object.userData.angle)*orbitRadius;planet.position.z=Math.sin(object.userData.angle)*orbitRadius})}stars.rotation.y+=delta*.0005;controls.update();updateLabel();renderer.render(scene,camera)}
function updateLabel(){const label=document.getElementById("label");if(!labelsEnabled||!selectedObject||!objects[selectedObject]){label.style.display="none";return}label.style.display="block";const position=new THREE.Vector3();objects[selectedObject].getWorldPosition(position);position.project(camera);label.style.left=((position.x*.5+.5)*innerWidth)+"px";label.style.top=((-position.y*.5+.5)*innerHeight)+"px";label.textContent=selectedObject}
function hideLoadingScreen(){const loading=document.getElementById("loading");loading.style.opacity="0";setTimeout(()=>loading.style.display="none",800)}window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});loadPlanetData();animate();
</script>
</body>
</html>
